services:
  worldmonitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-ghcr.io/c-four-international/c4dashboard:latest}
    container_name: worldmonitor
    restart: unless-stopped
    ports:
      - "3000:3000"  # Web dashboard & API gateway
      - "3004:3004"  # AIS / OpenSky WebSocket relay
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - RELAY_PORT=3004
      - RELAY_HOST=127.0.0.1
      - WS_RELAY_URL=http://127.0.0.1:3004
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M
