# ==============================================================================
# WorldMonitor Fallback Dashboard — Nginx Static Deployment Configuration
# Optimized for Home-Hosted VM / Bare-Metal Static Hosting
# ==============================================================================

# MIME types configuration for modern web assets (WASM, ES modules, WebManifest)
types {
    application/javascript                js mjs;
    application/wasm                      wasm;
    application/manifest+json             webmanifest;
    application/json                      json;
    image/svg+xml                         svg svgz;
    image/webp                            webp;
    font/woff2                            woff2;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Document root pointing to Vite production build output
    root /var/www/worldmonitor/dist;
    index index.html;

    # Performance optimizations for static file transmission
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Micro-cache file descriptors to minimize disk I/O on VM storage
    open_file_cache max=5000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # --------------------------------------------------------------------------
    # Static Pre-compression (Zero CPU Overhead during requests)
    # Serves pre-compressed .gz and .br generated at build time by Vite
    # --------------------------------------------------------------------------
    gzip on;
    gzip_static on; # http_gzip_static_module (standard in almost all Nginx packages)
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Brotli static precompression (uncomment if ngx_brotli is enabled on your VM)
    # brotli_static on;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/wasm;

    # --------------------------------------------------------------------------
    # Security & Privacy Headers
    # --------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # --------------------------------------------------------------------------
    # Static Assets — Long-Term Immutable Caching (Hashed Filenames)
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static data / geojson / maps
    location /data/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # Favicons & static branding
    location ~* ^/(favico|icons)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Service Worker & HTML Shells — Must Revalidate Immediately
    # --------------------------------------------------------------------------
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }

    location ~* \.(html|webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Unproxied API Endpoints Handling in Static Fallback Mode
    # Returns clean JSON 503 instead of HTML 404 so dashboard layer probes
    # cleanly detect unavailability and grey out controls without console spam
    # --------------------------------------------------------------------------
    location /api/ {
        default_type application/json;
        return 503 '{"error":"API service unavailable in static fallback mode","status":503,"fallback":true}';
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Optional: If you run a local API bridge or proxy, replace the above block with:
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8787;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_connect_timeout 5s;
    #     proxy_read_timeout 15s;
    # }

    # --------------------------------------------------------------------------
    # SPA Routing Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
